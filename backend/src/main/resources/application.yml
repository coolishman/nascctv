server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/nascctv?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: root
  sql:
    init:
      mode: always

mybatis:
  configuration:
    map-underscore-to-camel-case: true

security:
  jwt:
    issuer: nascctv
    secret: change-me-to-a-strong-secret-key
    expiration-minutes: 120
